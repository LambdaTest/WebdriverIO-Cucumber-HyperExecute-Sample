---
version: 0.1
globalTimeout: 150
testSuiteTimeout: 150
testSuiteStep: 150

runson: ${matrix.os}
autosplit: true
retryOnFailure: true
maxRetries: 1
concurrency: 1
parallelism: 1

matrix:
  os: [linux, mac, win]
  tests: [ "Features/ToDo.feature:7","Features/ToDo.feature:21","Features/ToDo.feature:35"]

pre:
  # Node 14 is needed by @wdio/sync; scripts/node14.js fetches it per OS (mac runners can't use `runtime`)
  - node scripts/node14.js npm install

cacheKey: 'hybrid-v1-{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules

mergeArtifacts: true

uploadArtefacts:
  [{
    "name": "Reports",
    "path": ["Reports/*"]
  }]

report: true
partialReports:
    type: json
    location: Reports/
    frameworkName: extent
  
testDiscovery:
  type: automatic
  mode: remote
  args:
    featureFilePaths: Features/
    frameWork: java
    specificTags: ["@ToDoOne", "@ToDoTwo", "@ToDoThree"]

testRunnerCommand: node scripts/node14.js wdio wdio.conf.js --spec=$test

jobLabel: [selenium-webdriverIO, hybrid]