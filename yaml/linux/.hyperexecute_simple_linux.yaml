---
version: 0.1
runson: linux
runtime:
  language: node
  version: "14"
concurrency: 2
autosplit: true
pre:
  - npm install

cacheKey: 'v2-{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules
  
testDiscovery:
  type: automatic
  args:
    featureFilePaths: Features/
    frameWork: java
    specificTags: ["@ToDoOne", "@ToDoTwo", "@ToDoThree"]

testRunnerCommand: npx wdio wdio.conf.js --spec=$test

jobLabel: [selenium-webdriverIO, linux, autosplit-simple]