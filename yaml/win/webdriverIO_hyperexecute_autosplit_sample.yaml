---
version: 0.1
globalTimeout: 150
testSuiteTimeout: 150
testSuiteStep: 150

runson: win

autosplit: true
retryOnFailure: true

maxRetries: 1
concurrency: 2

pre:
  # Node 14 is needed by @wdio/sync; scripts/node14.js fetches it and runs npm/wdio with it
  - node scripts/node14.js npm install

cacheKey: 'win-v1-{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules
  
mergeArtifacts: true

uploadArtefacts:
  [{
    "name": "Reports",
    "path": ["Reports/*"]
  }]

report: true
partialReports:
    type: json
    location: Reports/
    frameworkName: extent

testDiscovery:
  type: automatic
  args:
    featureFilePaths: Features/
    frameWork: java
    specificTags: ["@ToDoOne", "@ToDoTwo", "@ToDoThree"]

testRunnerCommand: node scripts/node14.js wdio wdio.conf.js --spec=$test

jobLabel: [selenium-webdriverIO, win, autosplit]