---
version: 0.1
globalTimeout: 150
testSuiteTimeout: 150
testSuiteStep: 150

runson: win

retryOnFailure: true

maxRetries: 1
concurrency: 2

pre:
  # Node 14 is needed by @wdio/sync; scripts/node14.js fetches it and runs npm/wdio with it
  - node scripts/node14.js npm install

cacheKey: 'win-v1-{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules

matrix:
  os: [win]
  count: [1,2]
  tests: [ "Features/ToDo.feature:7","Features/ToDo.feature:21","Features/ToDo.feature:35"]

mergeArtifacts: true

uploadArtefacts:
  [{
    "name": "Reports",
    "path": ["Reports/*"]
  }]

report: true
partialReports:
    type: json
    location: Reports/
    frameworkName: extent

featureFilePaths: Features/
  
testSuites:
  - node scripts/node14.js wdio wdio.conf.js --spec=$tests

jobLabel: [selenium-webdriverIO, win, matrix]