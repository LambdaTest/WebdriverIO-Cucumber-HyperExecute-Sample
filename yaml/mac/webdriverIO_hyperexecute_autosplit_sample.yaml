---
version: 0.1
globalTimeout: 150
testSuiteTimeout: 150
testSuiteStep: 150

runson: mac

autosplit: true
retryOnFailure: true

maxRetries: 1
concurrency: 1

pre:
  # Node 14 has no darwin-arm64 build; use the x64 build (runs via Rosetta) since @wdio/sync needs Node <= 14
  - bash -c 'curl -sL https://nodejs.org/dist/v14.21.3/node-v14.21.3-darwin-x64.tar.gz | tar xz'
  - ./node-v14.21.3-darwin-x64/bin/node ./node-v14.21.3-darwin-x64/bin/npm install --scripts-prepend-node-path=true

cacheKey: 'mac-v5-{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules

mergeArtifacts: true

uploadArtefacts:
  [{
    "name": "Reports",
    "path": ["Reports/*"]
  }]

report: true
partialReports:
    type: json
    location: Reports/
    frameworkName: extent
  
testDiscovery:
  # mode: remote
  type: automatic
  args:
    featureFilePaths: Features/
    frameWork: java
    specificTags: ["@ToDoOne", "@ToDoTwo", "@ToDoThree"]

testRunnerCommand: ./node-v14.21.3-darwin-x64/bin/node node_modules/@wdio/cli/bin/wdio.js wdio.conf.js --spec=$test

jobLabel: [selenium-webdriverIO, mac, autosplit]